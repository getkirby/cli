name: CI
on: [push, pull_request]

jobs:
  tests:
    name: Unit Tests - PHP ${{ matrix.php }}

    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1

      - name: Setup PHP environment
        uses: ./.github/actions/setup-php
        with:
          php: ${{ matrix.php }}
          extensions: mbstring, zip, pcov
          ini: 'pcov.directory=., pcov.exclude="~(vendor|tests)~"'
          coverage: pcov

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Check Composer platform requirements
        run: composer check-platform-reqs

      - name: Cache PHPUnit results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # pin@v6.1.0
        with:
          path: ./.phpunit.cache
          key: phpunit-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: phpunit-${{ matrix.php }}-

      - name: Run tests
        run: composer run test

  analysis:
    name: Analysis

    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      php: "8.3"
      # lowest PHP version supported by composer.json;
      # Psalm analyzes against it so that CI catches
      # syntax and functions that are not available there
      target: "8.2"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1

      - name: Setup PHP environment
        uses: ./.github/actions/setup-php
        with:
          php: ${{ env.php }}
          tools: composer-normalize:2.52.0

      - name: Setup problem matchers
        run: echo "::add-matcher::${{ runner.tool_cache }}/php.json"

      - name: Validate composer.json/composer.lock
        run: composer run analyze:composer

      - name: Ensure that composer.json is normalized
        env:
          GITHUB_TOKEN: ""
        run: composer-normalize --dry-run

      - name: Cache Psalm analysis data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # pin@v6.1.0
        with:
          path: ~/.cache/psalm
          key: psalm-${{ env.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            psalm-${{ env.php }}-
            psalm-

      - name: Statically analyze using Psalm
        run: composer run analyze:psalm -- --output-format=github --php-version=${{ env.target }}

  coding-style:
    name: Coding Style

    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      php: "8.3"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1

      - name: Setup PHP environment
        uses: ./.github/actions/setup-php
        with:
          php: ${{ env.php }}

      - name: Cache PHP-CS-Fixer data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # pin@v6.1.0
        with:
          path: ./.php-cs-fixer.cache
          key: php-cs-fixer-${{ hashFiles('.php-cs-fixer.dist.php') }}
          restore-keys: php-cs-fixer-

      - name: Check for PHP coding style violations
        env:
          PHP_CS_FIXER_IGNORE_ENV: 1
        # Use the --dry-run flag in push builds to get a failed CI status
        run: >
          composer run fix -- --diff ${{ github.event_name != 'pull_request' && '--dry-run' || '' }}

      - name: Create code suggestions from the coding style changes (on PR only)
        if: always() && github.event_name == 'pull_request'
        uses: reviewdog/action-suggester@2558ba17e65a9039e73764a73009fc05fef28a46 # pin@v1.24.3
        with:
          tool_name: PHP-CS-Fixer
          fail_on_error: "true"
